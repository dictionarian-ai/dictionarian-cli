[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dictionarian-cli"
version = "0.1.0"
description = "Local-first CLI and Python SDK for Dictionarian"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "dictionarian-ai>=0.1.0,<0.2.0",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "rich>=13,<15",
  "tomli>=2,<3; python_version < '3.11'",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
postgres = ["dictionarian-ai[postgres]>=0.1.0,<0.2.0"]
mssql = ["dictionarian-ai[mssql]>=0.1.0,<0.2.0"]
redshift = ["dictionarian-ai[redshift]>=0.1.0,<0.2.0"]
all-databases = ["dictionarian-ai[postgres,mssql,redshift]>=0.1.0,<0.2.0"]
dev = [
  "pyinstaller>=6.10,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
dictionarian = "dictionarian_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dictionarian_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"*.spec" = ["F821"]
