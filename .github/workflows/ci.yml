name: CI

env:
  DICTIONARIAN_CORE_REF: ac67a545763407cd53a1f33d7773992ae3b20414

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: >-
          pip install -e '.[dev]'
          "dictionarian-ai @ git+https://github.com/dictionarian-ai/dictionarian-ai.git@${DICTIONARIAN_CORE_REF}"
      - run: ruff check .
      - run: pytest --cov=dictionarian_cli --cov-report=term-missing
